# Install in /etc/nginx/conf.d/plancatch-domain.conf AFTER issuing the certificate.
# Keep /etc/nginx/default.d/plancatch.conf for the existing same-origin proxies.
server {
    listen 80;
    server_name plancatch.kro.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://plancatch.kro.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name plancatch.kro.kr;

    ssl_certificate /etc/letsencrypt/live/plancatch.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plancatch.kro.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PlanCatchTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/default.d/plancatch.conf;
}
